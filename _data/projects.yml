# Single source for project cards, rendered by _includes/project-card.html
# on both index.md and work.md. `anchor` points into the case-study post.
# File order is render order on both pages; `featured` picks the three on the
# home page. Archeo leads deliberately — real client, real operational mess,
# clean before/after.

- name: Archeo
  featured: true
  image: /assets/work/archeo.svg
  alt: Loose spreadsheets and PDF reports consolidated into one records system
  stack: [Ruby on Rails, TailwindCSS, PostgreSQL]
  blurb: >
    An internal platform for an excavation company running on dozens of Excel sheets
    where nobody was sure which file was current. Sites, crews and hours in one system.
  anchor: archeo

- name: Pastrac
  featured: true
  image: /assets/work/pastrac.jpg
  alt: The Pastrac marketing site, showing the iOS app on a live map
  stack: [React Native, Supabase, iOS]
  blurb: >
    An iOS app for pinning the places that matter to you — drop a pin on a live map,
    attach notes and photos, categorise the moment, then choose who sees it.
  anchor: pastrac
  links:
    - { label: "pastrac.com", url: "https://www.pastrac.com/" }
    - { label: "App Store", url: "https://apps.apple.com/us/app/pastrac-app/id6754891045" }

- name: Collaborators
  image: /assets/work/collaborators.jpg
  alt: The Collaborators landing page, a dark Web3 interface
  stack: [Next.js, Solana, Prisma, NextAuth]
  blurb: >
    Turns verified GitHub activity into on-chain rewards. Maintainers set bounties on
    open issues; contributors get paid to their wallet once the work is reviewed.
  anchor: collaborators
  links:
    - { label: "collaborators.build", url: "https://collaborators.build" }
    - { label: "Code", url: "https://github.com/andr-drgm/collaborators" }

