{%- assign p = include.project -%}
<li>
  <a class="thumb" style="--fig: 1200 / {{ p.figure_height | default: 675 }}" href="{{ include.post_url }}#{{ p.anchor }}" tabindex="-1" aria-hidden="true">
    <img src="{{ p.image }}" alt="{{ p.alt }}" width="1200" height="675" loading="lazy" decoding="async">
  </a>
  <div class="row-body">
    <h3>{% if p.anchor %}<a href="{{ include.post_url }}#{{ p.anchor }}">{{ p.name }}</a>{% else %}{{ p.name }}{% endif %}</h3>
    <span class="stack">{{ p.stack | join: " · " }}</span>
    <p>{{ p.blurb }}</p>
    <div class="row-links">
      {%- for link in p.links %}
      <a href="{{ link.url }}"{% unless link.url contains "andrei-dragomir.com" %} target="_blank" rel="noopener"{% endunless %}>{{ link.label }} ↗</a>
      {%- endfor %}
      {%- if p.anchor %}<a href="{{ include.post_url }}#{{ p.anchor }}">Case study →</a>{% endif %}
    </div>
  </div>
</li>
