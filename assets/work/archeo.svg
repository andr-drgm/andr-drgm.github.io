<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Scattered spreadsheets and PDF reports consolidated into one excavation records system">
  <rect width="1200" height="675" fill="#eaeae6"/>
  <!-- excavation strata -->
  <g opacity="0.5">
    <path d="M0 470 H1200 V675 H0 Z" fill="#e4e4df"/>
    <path d="M0 530 H1200 V675 H0 Z" fill="#d5d5cf"/>
    <path d="M0 600 H1200 V675 H0 Z" fill="#c3c3bc"/>
  </g>
  <g stroke="#12604a" stroke-width="2" opacity="0.35" fill="none">
    <path d="M0 470 H1200 M0 530 H1200 M0 600 H1200"/>
  </g>
  <!-- scattered loose files, left -->
  <g transform="translate(96 118)">
    <g fill="#ffffff" stroke="#d2d2cc" stroke-width="2">
      <rect x="24" y="46" width="132" height="168" rx="5" transform="rotate(-9 90 130)"/>
      <rect x="12" y="26" width="132" height="168" rx="5" transform="rotate(4 78 110)"/>
      <rect x="0" y="0" width="132" height="168" rx="5"/>
    </g>
    <g fill="#dededa">
      <rect x="16" y="20" width="86" height="9" rx="4.5"/>
      <rect x="16" y="40" width="100" height="7" rx="3.5"/>
      <rect x="16" y="56" width="72" height="7" rx="3.5"/>
      <rect x="16" y="72" width="94" height="7" rx="3.5"/>
      <rect x="16" y="88" width="60" height="7" rx="3.5"/>
    </g>
    <text x="16" y="132" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#0c4536">.xlsx</text>
    <text x="16" y="154" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#0c4536">.pdf</text>
    <text x="0" y="250" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" fill="#585c61">scattered files</text>
  </g>
  <!-- arrow -->
  <g stroke="#12604a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M410 208 H508"/>
    <path d="M488 188 L512 208 L488 228"/>
  </g>
  <!-- one system, right -->
  <g transform="translate(566 96)">
    <rect x="0" y="0" width="536" height="286" rx="12" fill="#ffffff" stroke="#131518" stroke-width="2.5"/>
    <path d="M0 12 A12 12 0 0 1 12 0 H524 A12 12 0 0 1 536 12 V52 H0 Z" fill="#131518"/>
    <g fill="#5a9e85"><circle cx="26" cy="26" r="6"/></g>
    <g fill="#7b7f83"><circle cx="46" cy="26" r="6"/><circle cx="66" cy="26" r="6"/></g>
    <text x="92" y="33" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#eaeae6">archeo — sites &amp; crews</text>
    <!-- table -->
    <g stroke="#dcdcd6" stroke-width="1.5">
      <path d="M0 96 H536 M0 140 H536 M0 184 H536 M0 228 H536"/>
      <path d="M168 52 V286 M320 52 V286 M432 52 V286"/>
    </g>
    <g fill="#585c61" font-family="ui-monospace, Menlo, monospace" font-size="13">
      <text x="18" y="80">site</text><text x="186" y="80">crew</text><text x="338" y="80">hours</text><text x="450" y="80">status</text>
    </g>
    <g fill="#cbcbc5">
      <rect x="18" y="112" width="118" height="10" rx="5"/><rect x="186" y="112" width="96" height="10" rx="5"/><rect x="338" y="112" width="52" height="10" rx="5"/>
      <rect x="18" y="156" width="96" height="10" rx="5"/><rect x="186" y="156" width="112" height="10" rx="5"/><rect x="338" y="156" width="44" height="10" rx="5"/>
      <rect x="18" y="200" width="126" height="10" rx="5"/><rect x="186" y="200" width="80" height="10" rx="5"/><rect x="338" y="200" width="60" height="10" rx="5"/>
      <rect x="18" y="244" width="104" height="10" rx="5"/><rect x="186" y="244" width="104" height="10" rx="5"/><rect x="338" y="244" width="48" height="10" rx="5"/>
    </g>
    <g fill="#12604a" opacity="0.85">
      <rect x="450" y="110" width="58" height="16" rx="8"/><rect x="450" y="198" width="58" height="16" rx="8"/>
    </g>
    <g fill="#5a9e85">
      <rect x="450" y="154" width="58" height="16" rx="8"/><rect x="450" y="242" width="58" height="16" rx="8"/>
    </g>
    <text x="0" y="332" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" fill="#585c61">one system, one source of truth</text>
  </g>
</svg>
