<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Brushed stainless steel panels — a service website for a steel fabrication business">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e6e0"/>
      <stop offset="0.45" stop-color="#c9c6c0"/>
      <stop offset="0.55" stop-color="#dedbd5"/>
      <stop offset="1" stop-color="#b4b1ab"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#f4f0ea"/>

  <!-- brushed steel panel -->
  <g transform="translate(96 118)">
    <rect x="0" y="0" width="470" height="440" rx="10" fill="url(#steel)"/>
    <g stroke="#ffffff" stroke-width="1" opacity="0.35">
      <path d="M0 30 H470 M0 62 H470 M0 94 H470 M0 126 H470 M0 158 H470 M0 190 H470 M0 222 H470 M0 254 H470 M0 286 H470 M0 318 H470 M0 350 H470 M0 382 H470 M0 414 H470"/>
    </g>
    <g stroke="#9a978f" stroke-width="1" opacity="0.4">
      <path d="M0 46 H470 M0 110 H470 M0 174 H470 M0 238 H470 M0 302 H470 M0 366 H470 M0 430 H470"/>
    </g>
    <!-- weld seam -->
    <path d="M0 220 H470" stroke="#8b877f" stroke-width="4"/>
    <g fill="#f59e0b" opacity="0.9">
      <circle cx="58" cy="220" r="7"/><circle cx="132" cy="220" r="7"/><circle cx="206" cy="220" r="7"/>
      <circle cx="280" cy="220" r="7"/><circle cx="354" cy="220" r="7"/><circle cx="428" cy="220" r="7"/>
    </g>
  </g>

  <g transform="translate(636 176)">
    <text x="0" y="0" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="3" fill="#c2410c">MEDIAȘ · SIBIU</text>
    <text x="0" y="66" font-family="-apple-system, Segoe UI, sans-serif" font-size="52" font-weight="800" fill="#171614">DSS-INOX</text>
    <text x="0" y="112" font-family="-apple-system, Segoe UI, sans-serif" font-size="23" fill="#6f6a62">Confecții din oțel inoxidabil</text>
    <g stroke="#cfc7b8" stroke-width="2"><path d="M0 150 H420"/></g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#6f6a62">
      <text x="0" y="190">durabilitate</text>
      <text x="0" y="222">aspect modern</text>
      <text x="0" y="254">confecții la comandă</text>
    </g>
    <g transform="translate(0 288)">
      <rect x="0" y="0" width="196" height="46" rx="9" fill="#c2410c"/>
      <text x="98" y="30" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Contactează-ne</text>
