<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == "/" %}{{ site.title }} — Internal platforms, automation, MVPs{% else %}{{ page.title }} — {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="preload" href="/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/main.css">
<meta name="theme-color" content="#f5f5f3">
<meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ page.image | default: '/assets/img/andrei.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="brand" href="/">
      <img class="brand-face" src="/assets/img/andrei.jpg" alt="" width="28" height="28" decoding="async">
      <span>Andrei Dragomir<b>.</b></span>
    </a>
    <nav>
      <a href="/work/"{% if page.url == "/work/" %} aria-current="page"{% endif %}>Work</a>
      <a href="/writing/"{% if page.url == "/writing/" or page.date %} aria-current="page"{% endif %}>Writing</a>
      <a class="btn btn-primary btn-sm" href="mailto:{{ site.email }}">Get in touch</a>
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer>
  <div class="wrap">
    <span class="meta">© {{ site.time | date: "%Y" }} {{ site.author }} · Sibiu, Romania · {{ site.email }}</span>
    <nav>
      <a href="https://github.com/andr-drgm" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/andr-drgm/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://x.com/adrw_dev" target="_blank" rel="noopener">Twitter</a>
    </nav>
  </div>
</footer>

</body>
</html>
