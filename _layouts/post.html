---
layout: default
---
<section>
  <div class="wrap">
    <div class="post-head">
      <p class="label">Blog</p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="lede" style="margin-top:1rem">{{ page.description }}</p>{% endif %}
      <span class="meta">{{ page.date | date: "%d %B %Y" }} · {{ content | number_of_words | divided_by: 220 | plus: 1 }} min read</span>
    </div>

    <article class="post">
      {{ content }}
    </article>

    <p class="section-foot"><a href="/blog/">← All writing</a></p>
  </div>
</section>
